<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>AI見える化オフィス</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>AI見える化オフィス</h1>
      <div class="topbar-sub" id="topbar-sub">読み込み中...</div>
    </div>
    <a class="topbar-button" href="settings.html">⚙ 設定</a>
  </header>

  <nav class="workspace-tabs" id="workspace-tabs" hidden></nav>

  <main class="floor">
    <div class="rooms" id="rooms"></div>

    <aside class="side-panels">
      <section class="lobby" id="lobby" hidden>
        <div class="lobby-head">
          <h2>ロビー（管理外のセッション）</h2>
          <span class="lobby-count"></span>
        </div>
        <div class="lobby-list"></div>
        <p class="lobby-note">このオフィスの外で動いている claude です。指示は出せません。</p>
      </section>

      <section class="activity-log">
      <div class="log-header">
        <h2>活動ログ</h2>
        <button type="button" id="log-toggle" class="log-toggle" aria-expanded="false">▼ すべて表示</button>
      </div>
      <div class="log-latest" id="log-latest"></div>
        <ul id="log-list" class="log-full"></ul>
      </section>
    </aside>
  </main>



  <div class="modal-backdrop" id="adopt-modal" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="adopt-title">
      <header class="modal-head">
        <h2 id="adopt-title">セッションを迎え入れる</h2>
        <button type="button" class="modal-close" id="adopt-close" aria-label="閉じる">×</button>
      </header>
      <div class="adopt-body" id="adopt-body"></div>
      <footer class="modal-foot">
        <div class="settings-status" id="adopt-status"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="adopt-cancel">キャンセル</button>
          <button type="button" class="btn-primary" id="adopt-confirm">迎え入れる</button>
        </div>
      </footer>
    </div>
  </div>

  <div class="modal-backdrop" id="question-modal" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="question-title">
      <header class="modal-head">
        <h2 id="question-title">確認</h2>
        <button type="button" class="modal-close" id="question-close" aria-label="閉じる">×</button>
      </header>
      <div class="question-body" id="question-body"></div>
      <footer class="modal-foot">
        <div class="settings-status" id="question-status"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="question-later">後で答える</button>
        </div>
      </footer>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
