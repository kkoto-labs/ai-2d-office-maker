<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>AI見える化オフィス</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1>AI見える化オフィス</h1>
      <div class="topbar-sub" id="topbar-sub">読み込み中...</div>
    </div>
    <button type="button" class="topbar-button" id="settings-open">⚙ 設定</button>
  </header>

  <section class="console-panel">
    <div class="console-form-row">
      <form id="instruct-form">
        <select id="instruct-target"></select>
        <textarea id="instruct-input" rows="2" placeholder="指示を入力..."></textarea>
        <button type="submit">指示を送る</button>
      </form>
      <div class="instruct-status" id="instruct-status"></div>
    </div>
    <div class="console-reply" id="report-panel">
      <h2 id="report-title">回答</h2>
      <div id="report-text">まだ報告はありません。</div>
    </div>
  </section>

  <main class="floor">
    <div class="rooms" id="rooms"></div>

    <aside class="activity-log">
      <div class="log-header">
        <h2>活動ログ</h2>
        <button type="button" id="log-toggle" class="log-toggle" aria-expanded="false">▼ すべて表示</button>
      </div>
      <div class="log-latest" id="log-latest"></div>
      <ul id="log-list" class="log-full"></ul>
    </aside>
  </main>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="modal-head">
        <h2 id="settings-title">エージェント設定</h2>
        <button type="button" class="modal-close" id="settings-close" aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <nav class="settings-nav">
          <ul id="settings-nav-list"></ul>
          <button type="button" class="nav-add" id="agent-add">＋ エージェントを追加</button>
        </nav>
        <div class="settings-editor" id="settings-editor"></div>
      </div>
      <footer class="modal-foot">
        <div class="settings-status" id="settings-status"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="settings-cancel">キャンセル</button>
          <button type="button" class="btn-primary" id="settings-save">保存</button>
        </div>
      </footer>
    </div>
  </div>

  <div class="modal-backdrop sprite-backdrop" id="sprite-modal" hidden>
    <div class="modal modal-narrow" role="dialog" aria-modal="true" aria-labelledby="sprite-title">
      <header class="modal-head">
        <h2 id="sprite-title">キャラクター画像を選ぶ</h2>
        <button type="button" class="modal-close" id="sprite-close" aria-label="閉じる">×</button>
      </header>
      <div class="sprite-grid" id="sprite-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
